version: "3.9"

name: pos-system

services:
  postgres:
    image: postgres:17-alpine
    container_name: pos_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - pos-network

volumes:
  postgres_data:

networks:
  pos-network:
    driver: bridge